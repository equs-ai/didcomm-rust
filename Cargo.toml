[[bench]]
name = 'pack_signed'
harness = false

[[bench]]
name = 'pack_encrypted'
harness = false

[[example]]
name = 'attachments'

[[example]]
name = 'advanced_params'

[[example]]
name = 'basic'

[[example]]
name = 'rotate_did'

[[example]]
name = 'routing'

[package]
name = 'equs-didcomm'
version = '0.1.0'
edition = '2018'
description = 'DIDComm for Rust'
license = 'Apache-2.0'
repository = 'https://github.com/equs-ai/didcomm-rust'
exclude = ['.github/', '.gitignore', 'Specs/', 'docs/', 'renovate.json', 'wrappers/']
readme = 'README.md'

[lib]
name = 'didcomm'

[dependencies]
anyhow = '1.0'
base64 = '0.13'
async-trait = '0.1'
thiserror = '1.0'
serde_json = '1.0'
serde-enum-str = '0.1'
sha2 = '0.9'
bs58 = "0.4.0"
varint = "0.9.0"
lazy_static = { version = "1.4.0", optional = true }
askar-crypto = { version = "=0.3.3", features = ['std'] }

[dependencies.serde]
version = '1.0'
features = ['derive']

[dependencies.uuid]
version = "0.8"
features = ["v4", "stdweb"]

[dev-dependencies]
lazy_static = '1.4.0'

[dev-dependencies.tokio]
version = '1.9'
features = [
    'rt',
    'macros',
]

[dev-dependencies.getrandom]
version = '0.2'
features = ['js']

[dev-dependencies.criterion]
version = '0.3'
features = ['async_futures']

[features]
uniffi = []
testvectors = ["lazy_static"]
